<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!--PAGE-->
<title>Wall Pals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@600;800&family=Sedgwick+Ave+Display&display=swap">
<style>
/* Layout: one full-bleed portrait canvas (a wall), HUD on top, a kerb of spray cans at the bottom. */
:root{
  --ink:#15102b; --night:#1d1836; --paper:#fff6e6;
  --pink:#ff3d8b; --sun:#ffd60a; --mint:#22e3a4; --sky:#27b8ff;
  --f-fat:'Bagel Fat One','Baloo 2',system-ui,sans-serif;
  --f-tag:'Sedgwick Ave Display','Marker Felt','Comic Sans MS',cursive;
  --f-ui:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none;
  display:flex;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;width:100%;max-width:520px;overflow:hidden;background:var(--night)}
#game{display:block;width:100%;height:100%;touch-action:none;outline:none}
.pre{position:absolute;left:-999px;opacity:0;pointer-events:none}
</style>
<div id="stage">
  <canvas id="game" tabindex="0" aria-label="Wall Pals, a spray painting game. Hold and drag to spray."></canvas>
  <span class="pre" style="font-family:var(--f-fat)">WALL PALS</span>
  <span class="pre" style="font-family:var(--f-tag)">wake up</span>
  <span class="pre" style="font-family:var(--f-ui);font-weight:800">score</span>
</div>
<script>
(()=>{'use strict';
const stage=document.getElementById('stage'),cv=document.getElementById('game'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,PI=Math.PI;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const easeOutBack=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const INK='#15102b',PAPER='#fff6e6';
const F_FAT="'Bagel Fat One','Baloo 2',system-ui,sans-serif",F_TAG="'Sedgwick Ave Display','Marker Felt','Comic Sans MS',cursive",F_UI="'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif";
const COLORS=[{c:'#ff3d8b'},{c:'#ff8a1f'},{c:'#ffd60a'},{c:'#22e3a4'},{c:'#27b8ff'},{c:'#9d5cff'}];

const store={get(k,d){try{const v=localStorage.getItem('wallpals.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('wallpals.'+k,JSON.stringify(v))}catch(e){}}};
let best=store.get('best',0),muted=store.get('muted',false),book=store.get('book',[]);
if(!Array.isArray(book))book=[];

/* ---------- canvas plumbing ---------- */
let W=390,H=780,DPR=1,BAR=110,TOP=92,pendingLayout=false;
function mk(w,h,scale=DPR){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*scale));c.height=Math.max(1,Math.ceil(h*scale));const x=c.getContext('2d');x.scale(scale,scale);return [c,x]}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function txt(c,s,x,y,size,font,fill,o={}){c.font=`${o.w||400} ${size}px ${font}`;c.textAlign=o.al||'center';c.textBaseline=o.bl||'middle';
  if(o.stroke){c.lineJoin='round';c.lineWidth=o.lw||size*.3;c.strokeStyle=o.stroke;c.strokeText(s,x,y)}c.fillStyle=fill;c.fillText(s,x,y)}
function starPath(c,x,y,r,rot=0){c.beginPath();for(let i=0;i<10;i++){const a=rot-PI/2+i*PI/5,q=i%2?r*.5:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath()}
function heartPath(c,x,y,r){c.beginPath();c.moveTo(x,y-r*.4);c.bezierCurveTo(x-r*.3,y-r,x-r*1.1,y-r*.85,x-r,y-r*.2);c.bezierCurveTo(x-r*.92,y+r*.35,x-r*.35,y+r*.65,x,y+r*.95);c.bezierCurveTo(x+r*.35,y+r*.65,x+r*.92,y+r*.35,x+r,y-r*.2);c.bezierCurveTo(x+r*1.1,y-r*.85,x+r*.3,y-r,x,y-r*.4);c.closePath()}

/* ---------- pals (shapes in unit space, roughly -1.1..1.1) ---------- */
const circ=(x,y,r)=>c=>{c.arc(x,y,r,0,TAU)};
const ell=(x,y,rx,ry,rot=0)=>c=>{c.ellipse(x,y,rx,ry,rot,0,TAU)};
const rect=(x,y,w,h,r)=>c=>{rr(c,x,y,w,h,r)};
const poly=p=>c=>{c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath()};
const starPts=(()=>{const p=[];for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,r=i%2?.6:1.28;p.push([Math.cos(a)*r,Math.sin(a)*r+.06])}return p})();
const blob=p=>c=>{const n=p.length,m=i=>[(p[i%n][0]+p[(i+1)%n][0])/2,(p[i%n][1]+p[(i+1)%n][1])/2];let s=m(0);c.moveTo(s[0],s[1]);for(let i=1;i<=n;i++){const q=m(i);c.quadraticCurveTo(p[i%n][0],p[i%n][1],q[0],q[1])}c.closePath()};
const PALS=[
 {name:'Hearty',faces:[[0,-.12,.95]],parts:[c=>{c.moveTo(0,-.4);c.bezierCurveTo(-.3,-1,-1.1,-.85,-1,-.2);c.bezierCurveTo(-.92,.35,-.35,.65,0,.95);c.bezierCurveTo(.35,.65,.92,.35,1,-.2);c.bezierCurveTo(1.1,-.85,.3,-1,0,-.4);c.closePath()}],shine:[-.55,-.52]},
 {name:'Boo',faces:[[0,-.28,.95]],parts:[c=>{c.moveTo(-.82,.92);c.lineTo(-.82,-.2);c.bezierCurveTo(-.82,-1.3,.82,-1.3,.82,-.2);c.lineTo(.82,.92);c.quadraticCurveTo(.55,.52,.273,.92);c.quadraticCurveTo(0,.52,-.273,.92);c.quadraticCurveTo(-.55,.52,-.82,.92);c.closePath()}],shine:[-.4,-.72]},
 {name:'Twinkle',faces:[[0,.08,.72]],parts:[blob(starPts)],shine:[-.2,-.42]},
 {name:'Nimbus',faces:[[0,.2,.9]],parts:[circ(-.58,.12,.47),circ(-.1,-.25,.62),circ(.52,.05,.52),rect(-1.05,.12,2.1,.6,.3)],shine:[-.3,-.5]},
 {name:'Zappy',faces:[[.02,-.06,.5]],parts:[poly([[.3,-1.12],[-.7,.12],[-.12,.12],[-.4,1.12],[.75,-.28],[.14,-.28],[.62,-1.12]])],shine:[-.05,-.7]},
 {name:'King Drip',faces:[[0,.3,.85]],parts:[poly([[-1,.75],[-1,-.5],[-.5,.02],[0,-.8],[.5,.02],[1,-.5],[1,.75]]),circ(-1,-.55,.17),circ(0,-.86,.19),circ(1,-.55,.17)],shine:[-.6,.05]},
 {name:'Mochi',faces:[[0,.22,1]],parts:[ell(0,.18,.98,.8),poly([[-.93,0],[-.86,-1.02],[-.15,-.5]]),poly([[.93,0],[.86,-1.02],[.15,-.5]])],shine:[-.45,-.25]},
 {name:'Drippy',faces:[[0,.3,.9]],parts:[c=>{c.moveTo(0,-1.12);c.bezierCurveTo(.2,-.6,.86,-.1,.86,.35);c.bezierCurveTo(.86,1.25,-.86,1.25,-.86,.35);c.bezierCurveTo(-.86,-.1,-.2,-.6,0,-1.12);c.closePath()}],shine:[-.4,-.05]},
 {name:'Shroomy',faces:[[0,.62,.6]],parts:[c=>{c.moveTo(-1.06,0);c.bezierCurveTo(-1.06,-1.35,1.06,-1.35,1.06,0);c.quadraticCurveTo(1.06,.26,.8,.26);c.lineTo(-.8,.26);c.quadraticCurveTo(-1.06,.26,-1.06,0);c.closePath()},rect(-.44,.1,.88,.98,.3)],shine:[-.45,-.6]},
 {name:'Hops',faces:[[0,.36,.95]],parts:[ell(0,.34,.84,.72),ell(-.4,-.56,.23,.58,-.16),ell(.4,-.56,.23,.58,.16)],shine:[-.4,.0]},
 {name:'Teddy',faces:[[0,.16,1]],parts:[circ(0,.12,.86),circ(-.7,-.62,.33),circ(.7,-.62,.33)],shine:[-.42,-.35]},
 {name:'Scoop',faces:[[0,-.4,.8]],parts:[poly([[-.62,.02],[.62,.02],[0,1.16]]),circ(0,-.42,.7)],shine:[-.32,-.78]},
 {name:'Spike',faces:[[0,-.38,.58]],parts:[rect(-.4,-1.05,.8,2.12,.4),rect(-.98,-.28,.3,.62,.15),rect(-.98,.08,.72,.28,.14),rect(.68,-.6,.3,.68,.15),rect(.3,-.2,.66,.28,.14)],shine:[-.2,-.82]},
 {name:'Bones',faces:[[0,-.14,1]],parts:[circ(0,-.2,.86),rect(-.52,.3,1.04,.72,.22)],shine:[-.42,-.65]},
 {name:'Rattle',faces:[[0,.24,.82]],parts:[rect(-.58,-.48,1.16,1.55,.2),ell(0,-.46,.52,.3),rect(-.3,-1.08,.6,.46,.1)],shine:[-.38,-.2]},
 {name:'Saturn',faces:[[0,-.02,.8]],parts:[circ(0,0,.76),ell(0,.06,1.16,.3,-.35)],shine:[-.32,-.42]},
];
const WORDS=['YO!','BOO','WOW','LOL','POP','OK!','COOL','YOLO','BOOM'];
function prepText(sh){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.font=`100px ${F_FAT}`;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const m=ctx.measureText(sh.word),w=m.width||100,asc=m.actualBoundingBoxAscent||72,desc=m.actualBoundingBoxDescent||2;
  const k=210/w,ys=clamp(170/((asc+desc)*k),1,1.9);sh.m={k,ys,yo:(asc-desc)/2};sh.faces=[];
  for(let i=0;i<sh.word.length;i++)if(sh.word[i]==='O'){const pre=ctx.measureText(sh.word.slice(0,i)).width,ow=ctx.measureText('O').width;
    sh.faces.push([(-w/2+pre+ow/2)*k/100,0,ow*k/100*.82])}
  ctx.restore();
}
function trace(c,sh,cx,cy,s,mode,lw,dash){
  c.save();c.translate(cx,cy);c.scale(s,s);c.lineJoin=c.lineCap='round';
  if(sh.word){const m=sh.m,f=s*m.k/100;c.scale(m.k/100,m.k*m.ys/100);c.font=`100px ${F_FAT}`;c.textAlign='center';c.textBaseline='alphabetic';
    if(mode==='fill')c.fillText(sh.word,0,m.yo);else{c.lineWidth=lw/f;if(dash)c.setLineDash(dash.map(d=>d/f));c.strokeText(sh.word,0,m.yo)}}
  else{c.lineWidth=lw/s;if(dash)c.setLineDash(dash.map(d=>d/s));for(const p of sh.parts){c.beginPath();p(c);mode==='fill'?c.fill():c.stroke()}}
  c.restore();
}
function drawFace(c,x,y,u,o){
  const ex=.25*u,ey=-.02*u,rx=.13*u,ry=.165*u;
  if(o.mood==='sleep'){c.strokeStyle=o.col;c.lineWidth=Math.max(2,u*.035);c.lineCap='round';
    for(const sx of[-1,1]){c.beginPath();c.arc(x+sx*ex,y+ey-rx*.3,rx*.8,.15*PI,.85*PI);c.stroke()}
    c.beginPath();c.arc(x,y+.22*u,.045*u,0,TAU);c.stroke();return}
  c.fillStyle='rgba(255,70,130,.5)';for(const sx of[-1,1]){c.beginPath();c.ellipse(x+sx*.46*u,y+.17*u,.1*u,.062*u,0,0,TAU);c.fill()}
  const bl=clamp(o.blink||0,0,1);
  for(const sx of[-1,1]){c.save();c.translate(x+sx*ex,y+ey);c.scale(1,Math.max(.08,1-bl));
    c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);c.fillStyle='#fff';c.fill();c.lineWidth=Math.max(1.5,u*.032);c.strokeStyle=INK;c.stroke();
    c.beginPath();c.arc((o.gx||0)*.04*u,(o.gy||0)*.05*u+ry*.08,.088*u,0,TAU);c.fillStyle=INK;c.fill();
    c.beginPath();c.arc((o.gx||0)*.04*u-.035*u,(o.gy||0)*.05*u-.04*u,.032*u,0,TAU);c.fillStyle='#fff';c.fill();c.restore()}
  c.fillStyle=INK;c.beginPath();c.arc(x,y+.2*u,.1*u,0,PI);c.closePath();c.fill();
  c.fillStyle='#ff6b9d';c.beginPath();c.ellipse(x,y+.265*u,.05*u,.028*u,0,0,TAU);c.fill();
}
function drawFaces(c,sh,cx,cy,s,o){for(const f of sh.faces)drawFace(c,cx+f[0]*s,cy+f[1]*s,s*f[2],o)}
function blinkAt(t,seed=0){const p=(t+seed*1.7)%3.4;return p>3.22?Math.sin((p-3.22)/.18*PI):0}
function drawPal(c,sh,x,y,s,col,t,seed=0){
  c.strokeStyle='#fff';trace(c,sh,x,y,s,'stroke',13);trace(c,sh,x+4,y+4,s,'stroke',13);
  c.fillStyle=c.strokeStyle=INK;for(let k=4;k>=0;k--){trace(c,sh,x+k,y+k,s,'stroke',7);trace(c,sh,x+k,y+k,s,'fill')}
  c.fillStyle=col;trace(c,sh,x,y,s,'fill');
  const sn=sh.shine||[-.3,-.45];c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.ellipse(x+sn[0]*s,y+sn[1]*s,.16*s,.07*s,-.6,0,TAU);c.fill();
  drawFaces(c,sh,x,y,s,{blink:blinkAt(t,seed),gx:Math.sin(t*.7+seed),gy:Math.cos(t*.5+seed)*.5});
}

/* ---------- audio (all synthesised) ---------- */
let AC=null,master,sfx,music,noiseBuf,hissGain,musicTimer=null,mStep=0,mNext=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
  sfx=AC.createGain();sfx.gain.value=.9;sfx.connect(master);music=AC.createGain();music.gain.value=.5;music.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=6200;bp.Q.value=.6;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=2600;hissGain=AC.createGain();hissGain.gain.value=0;
  s.connect(bp);bp.connect(hp);hp.connect(hissGain);hissGain.connect(sfx);s.start();
  mNext=AC.currentTime+.1;musicTimer=setInterval(schedule,60);
}
function tone(type,f0,f1,dur,vol,at,dest){if(!AC)return;const t=at||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||sfx);o.start(t);o.stop(t+dur+.03)}
function noise(dur,vol,freq,q,at,type,dest){if(!AC)return;const t=at||AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||sfx);s.start(t,Math.random());s.stop(t+dur+.03)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[{b:38,v:[53,57,60,64]},{b:43,v:[53,57,59,64]},{b:36,v:[52,55,59,62]},{b:45,v:[55,59,60,64]}];
const PENTA=[72,74,76,79,81,84];
function schedule(){
  if(!AC||AC.state!=='running')return;if(mNext<AC.currentTime-.3)mNext=AC.currentTime+.05;
  const sd=60/86/4;
  while(mNext<AC.currentTime+.18){
    const bar=(mStep>>4)&3,st=mStep&15,t=mNext+(st%2?.028:0),ch=CHORDS[bar];
    if(st===0||st===10||(st===7&&bar%2))tone('sine',125,42,.2,.55,t,music);
    if(st===4||st===12){noise(.15,.2,1900,.8,t,'bandpass',music);tone('triangle',200,120,.08,.12,t,music)}
    if(st%2===0)noise(.04,st===14?.08:.05,8500,.5,t,'highpass',music);
    if(st===0||st===7)for(const n of ch.v)tone('triangle',mtof(n),0,st?0.7:1.5,st?.03:.05,t,music);
    if(st===0||st===10)tone('sine',mtof(ch.b+(st?12:0)),0,.45,.22,t,music);
    if((st===2||st===6||st===8||st===14)&&Math.random()<.3)tone('sine',mtof(pick(PENTA)),0,.5,.035,t,music);
    mStep++;mNext+=sd;
  }
}
const S={
  rattle(){for(const d of[0,.07,.13,.2])noise(.03,.25,2800+rnd(900),6,AC&&AC.currentTime+d)},
  pop(){tone('sine',480,980,.1,.25)},
  ding(i){tone('triangle',mtof([72,76,79,84][i%4]),0,.35,.22);tone('sine',mtof([84,88,91,96][i%4]),0,.3,.08)},
  shutter(){noise(.06,.5,3200,1);noise(.09,.35,900,1,AC&&AC.currentTime+.08)},
  whistle(){if(!AC)return;for(let i=0;i<6;i++)tone('sine',2300+(i%2)*260,0,.07,.16,AC.currentTime+i*.065)},
  blip(){tone('square',880,0,.05,.06)},
  win(){if(!AC)return;[72,76,79,84,88].forEach((n,i)=>tone('triangle',mtof(n),0,.3,.16,AC.currentTime+i*.08))},
  lose(){if(!AC)return;[67,63,60,55].forEach((n,i)=>tone('triangle',mtof(n),0,.35,.18,AC.currentTime+i*.16))},
  tick(){tone('sine',1200,0,.05,.1)},
  tap(){tone('sine',620,420,.07,.2)}
};
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- walls ---------- */
const WALLS=['brickRed','concrete','shutterTeal','tile','wood','brickNavy','shutterCoral','brickCream'];
function buildWall(type){
  const [c,x]=mk(W,H),wh=H-BAR;
  if(type.startsWith('brick')){
    const p={brickRed:{m:'#4b3440',h:10,s:52,l:42},brickNavy:{m:'#151a33',h:228,s:34,l:31},brickCream:{m:'#8a7f73',h:36,s:40,l:72}}[type];
    x.fillStyle=p.m;x.fillRect(0,0,W,wh);const bw=W/7.5,bh=bw*.46;
    for(let r=0,y=0;y<wh;r++,y+=bh){const off=(r%2)*bw/2;for(let bx=-off;bx<W;bx+=bw){
      x.fillStyle=`hsl(${p.h+rnd(-5,5)},${p.s+rnd(-8,6)}%,${p.l+rnd(-6,6)-(Math.random()<.08?10:0)}%)`;x.fillRect(bx+1.5,y+1.5,bw-3,bh-3);
      x.fillStyle='rgba(255,255,255,.1)';x.fillRect(bx+1.5,y+1.5,bw-3,2);x.fillStyle='rgba(0,0,0,.17)';x.fillRect(bx+1.5,y+bh-4,bw-3,2.5)}}
  }else if(type==='concrete'){
    const g=x.createLinearGradient(0,0,0,wh);g.addColorStop(0,'#989eb3');g.addColorStop(1,'#7b8198');x.fillStyle=g;x.fillRect(0,0,W,wh);
    const ph=wh/3.2;
    for(let i=0;i<10;i++){const sx=rnd(W),sw=rnd(8,44),sy=Math.floor(rnd(3))*ph,len=rnd(90,300),sg=x.createLinearGradient(0,sy,0,sy+len);sg.addColorStop(0,'rgba(30,30,55,.17)');sg.addColorStop(1,'rgba(30,30,55,0)');x.fillStyle=sg;x.fillRect(sx,sy,sw,len)}
    for(let y=ph;y<wh;y+=ph){x.fillStyle='rgba(0,0,0,.3)';x.fillRect(0,y,W,2);x.fillStyle='rgba(255,255,255,.14)';x.fillRect(0,y+2,W,1)}
    x.fillStyle='rgba(0,0,0,.26)';x.fillRect(W/2,0,2,wh);
    for(let y=ph*.5;y<wh;y+=ph)for(const fx of[.12,.38,.62,.88]){x.beginPath();x.arc(W*fx,y,4,0,TAU);x.fillStyle='rgba(0,0,0,.3)';x.fill();x.beginPath();x.arc(W*fx,y+1,4,0,PI);x.strokeStyle='rgba(255,255,255,.2)';x.lineWidth=1;x.stroke()}
    for(let k=0;k<3;k++){let px=rnd(W),py=rnd(wh);x.beginPath();x.moveTo(px,py);for(let i=0;i<16;i++){px+=rnd(-14,14);py+=rnd(4,16);x.lineTo(px,py)}x.strokeStyle='rgba(25,25,45,.42)';x.lineWidth=1.2;x.stroke()}

function drawOver(){
  drawWorld();drawBar();dim(.86);const u=clamp(H/780,.7,1),a=easeOutBack(RT/.4);
  ctx.save();ctx.translate(W/2,H*.13);ctx.scale(a,a);ctx.rotate(-.05);txt(ctx,overWhy==='busted'?'BUSTED!':'TIME UP!',0,0,Math.min(60,W*.155),F_FAT,'#ff3d8b',{stroke:'#fff',lw:16});txt(ctx,overWhy==='busted'?'BUSTED!':'TIME UP!',0,0,Math.min(60,W*.155),F_FAT,'#ff3d8b',{stroke:INK,lw:9});ctx.restore();
  const ph=runPhotos.slice(-3),pw=Math.min(W*.28,H*.16);
  if(ph.length)ph.forEach((p,i)=>{const o=i-(ph.length-1)/2;polaroid(p.im,W/2+o*(pw+18),H*.34+Math.abs(o)*10,pw,o*.1,p.cap)});
  else txt(ctx,'no pals woke up this time',W/2,H*.34,24,F_TAG,'rgba(255,255,255,.7)');
  let y=H*.34+pw*.75+48*u;
  txt(ctx,runPhotos.length+(runPhotos.length===1?' pal woken up':' pals woken up'),W/2,y,17*u,F_UI,'rgba(255,246,230,.8)',{w:600});
  y+=48*u;txt(ctx,score.toLocaleString('en-US'),W/2,y,56*u,F_FAT,'#fff',{stroke:INK,lw:12});
  y+=44*u;if(newBest)pill('NEW BEST!',W/2,y,15,'#ffd60a',INK);else txt(ctx,'best '+best.toLocaleString('en-US'),W/2,y,16*u,F_UI,'rgba(255,246,230,.7)',{w:800});
  if(RT>.7){button('PLAY AGAIN',W/2,H-112,Math.min(250,W-70),54,'#ff3d8b',()=>{S.tap();startRun()},{pulse:true,fg:'#fff'});
    button('HOME',W/2,H-48,150,40,PAPER,()=>{S.tap();goTitle()},{size:17})}
}
function bookIm(b){if(!b.im&&b.src){b.im=new Image();b.im.src=b.src}return b.im&&(b.im.width||b.im.naturalWidth)?b.im:null}
function drawBook(){
  drawWorld();drawBar();dim(.88);txt(ctx,'BLACK BOOK',W/2,46,Math.min(40,W*.1),F_FAT,'#ffd60a',{stroke:INK,lw:10});
  txt(ctx,'your latest pals',W/2,82,22,F_TAG,'rgba(255,255,255,.8)');
  if(!book.length){txt(ctx,'empty for now…',W/2,H*.42,30,F_TAG,'#fff');txt(ctx,'Wake up a pal and its photo lands here.',W/2,H*.42+40,15,F_UI,'rgba(255,246,230,.75)',{w:600})}
  else{const top=108,bot=H-86,rows=Math.ceil(book.length/2),ch=(bot-top)/Math.max(rows,2),pw=Math.min(W/2-48,(ch-22)/1.19-26);
    book.forEach((b,i)=>{const cx=W/2+(i%2?1:-1)*(W/4-4),cy=top+ch*(Math.floor(i/2)+.5);polaroid(bookIm(b),cx,cy,pw,((i*37)%7-3)*.018,b.cap);
      for(let s=0;s<b.stars;s++){starPath(ctx,cx-pw/2+10+s*17,cy-ch/2+24,8);ctx.fillStyle='#ffd60a';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke()}})}
  button('BACK',W/2,H-44,150,42,PAPER,()=>{S.tap();state='title'},{size:18});
}
function buildLogo(){
  const w=W,h=W*.66,fs=Math.min(W*.265,H*.15);const [c,x]=mk(w,h);
  for(let i=0;i<46;i++){const col=pick(COLORS).c,r=rnd(26,60);x.globalAlpha=.5;x.drawImage(sprite(col),rnd(w*.06,w*.94)-r,rnd(h*.2,h*.8)-r,r*2,r*2)}x.globalAlpha=1;
  const rows=[['WALL','#ffd60a','#ff3d8b',-.03],['PALS','#22e3a4','#27b8ff',.05]];
  rows.forEach((r,i)=>{const cx=w/2+(i?w*.03:-w*.03),cy=h*.32+i*fs*.84;x.save();x.translate(cx,cy);x.rotate(-.07);
    x.font=`${fs}px ${F_FAT}`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
    x.strokeStyle='#fff';x.lineWidth=fs*.26;for(let k=0;k<=8;k+=4)x.strokeText(r[0],k,k);
    x.strokeStyle=x.fillStyle=INK;x.lineWidth=fs*.13;for(let k=8;k>=0;k--){x.strokeText(r[0],k,k);x.fillText(r[0],k,k)}
    const [lc,lx]=mk(w,fs*1.5);lx.font=x.font;lx.textAlign='center';lx.textBaseline='middle';const g=lx.createLinearGradient(0,fs*.3,0,fs*1.2);g.addColorStop(0,r[1]);g.addColorStop(1,r[2]);lx.fillStyle=g;lx.fillText(r[0],w/2,fs*.75);
    lx.globalCompositeOperation='source-atop';lx.fillStyle='rgba(255,255,255,.38)';lx.beginPath();lx.ellipse(w/2,fs*.36,w*.5,fs*.2,0,0,TAU);lx.fill();
    lx.fillStyle='rgba(20,0,60,.14)';for(let yy=fs*.85,q=0;yy<fs*1.3;yy+=8,q++)for(let xx=(q%2)*4;xx<w;xx+=8){lx.beginPath();lx.arc(xx,yy,lerp(.5,3,(yy-fs*.85)/(fs*.45)),0,TAU);lx.fill()}
    x.drawImage(lc,-w/2,-fs*.75,w,fs*1.5);x.restore()});
  // drips under the letters
  [[.2,'#ff3d8b',30],[.36,'#ffd60a',18],[.58,'#27b8ff',40],[.74,'#22e3a4',22]].forEach(d=>{const dx=w*d[0],dy=h*.32+fs*1.24;x.strokeStyle=INK;x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(dx,dy-8);x.lineTo(dx,dy+d[2]);x.stroke();x.strokeStyle=d[1];x.lineWidth=4.5;x.stroke()});
  logoC=c;
}
function drawTitle(){
  if(!logoC)buildLogo();drawWorld();
  const lh=W*.66,ly=Math.max(8,H*.045);ctx.save();ctx.translate(W/2,ly+lh/2);const b=1+Math.sin(T*2)*.012;ctx.scale(b,b);ctx.drawImage(logoC,-W/2,-lh/2,W,lh);ctx.restore();
  ctx.save();ctx.translate(W/2,ly+lh+2);ctx.rotate(-.04);txt(ctx,'wake up the wall!',0,0,Math.min(30,W*.075),F_TAG,'#fff',{stroke:INK,lw:6});ctx.restore();
  const py=ly+lh+Math.min(96,H*.115),ps=Math.min(W*.115,H*.062);
  [[PALS[1],'#22e3a4',-1],[PALS[0],'#ff3d8b',0],[PALS[2],'#ffd60a',1]].forEach((p,i)=>{const hop=Math.abs(Math.sin(T*2.6+i*1.1))*10;drawPal(ctx,p[0],W/2+p[2]*W*.29,py-hop+(i===1?8:0),ps*(i===1?1.12:1),p[1],T,i)});
  drawParts();drawBar();
  const by=Math.min(H-BAR-128,py+ps*1.2+72);
  button('PLAY',W/2,by,Math.min(230,W-90),62,'#ff3d8b',()=>{S.tap();startRun()},{pulse:true,fg:'#fff',size:30});
  button('BLACK BOOK',W/2,by+66,172,40,PAPER,()=>{S.tap();state='book';RT=0},{size:16});
  if(best>0)txt(ctx,'best '+best.toLocaleString('en-US'),W/2,by+108,15,F_UI,'#fff',{w:800,stroke:INK,lw:4});
  if(H-BAR-(by+120)>26)txt(ctx,'psst… the cans work. try the wall!',W/2,H-BAR-18,Math.min(19,W*.05),F_TAG,'rgba(255,255,255,.85)',{stroke:'rgba(21,16,43,.7)',lw:4});
  // sound toggle
  const sx=W-32,sy=32;ctx.fillStyle=INK;ctx.beginPath();ctx.arc(sx,sy+3,20,0,TAU);ctx.fill();ctx.fillStyle=PAPER;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,20,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(sx-10,sy-4);ctx.lineTo(sx-5,sy-4);ctx.lineTo(sx+1,sy-9);ctx.lineTo(sx+1,sy+9);ctx.lineTo(sx-5,sy+4);ctx.lineTo(sx-10,sy+4);ctx.closePath();ctx.fill();
  ctx.lineWidth=2.5;ctx.lineCap='round';if(muted){ctx.strokeStyle='#ff2e55';ctx.beginPath();ctx.moveTo(sx+5,sy-5);ctx.lineTo(sx+12,sy+5);ctx.moveTo(sx+12,sy-5);ctx.lineTo(sx+5,sy+5);ctx.stroke()}
  else{ctx.beginPath();ctx.arc(sx+2,sy,6,-.9,.9);ctx.stroke();ctx.beginPath();ctx.arc(sx+2,sy,10.5,-.8,.8);ctx.stroke()}
  buttons.push({x:sx-24,y:sy-24,w:48,h:48,fn:()=>{muted=!muted;store.set('muted',muted);if(master)master.gain.value=muted?0:1;S.tap()}});
  drawPops();
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(pendingLayout&&(state==='title'||state==='book')){layout();makeLevel(null,0,'brickRed')}
  update(dt);ctx.setTransform(DPR,0,0,DPR,0,0);buttons=[];
  if(state==='title')drawTitle();else if(state==='play')drawPlay();else if(state==='reveal')drawReveal();else if(state==='fail')drawFail();else if(state==='over')drawOver();else drawBook();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(1,flash*2.6)})`;ctx.fillRect(0,0,W,H)}
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();const p=pos(e);
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return}}
  if(state!=='play'&&state!=='title')return;
  if(p.y>H-BAR){let bi=0,bd=1e9;for(let i=0;i<6;i++){const d=Math.abs(canSlot(i).x-p.x);if(d<bd){bd=d;bi=i}}if(bi!==sel||true){sel=bi;canWiggle=.35;S.rattle();buzz(10)}return}
  if(spray.id===null&&canSpray()){spray.id=e.pointerId;spray.down=true;spray.x=p.x;spray.y=p.y;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==spray.id||!spray.down)return;e.preventDefault();const p=pos(e);p.y=Math.min(p.y,H-BAR+6);if(canSpray())strokeTo(p.x,p.y);else{spray.x=p.x;spray.y=p.y}});
const up=e=>{if(e.pointerId===spray.id)releaseSpray()};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){audioInit();if(state==='title')startRun();else if(state==='reveal'&&RT>2)nextLevel();else if(state==='over'&&RT>.7)startRun();else if(state==='play'&&L.inCov/L.total>=.7)finish();e.preventDefault()}
  else if(e.key>='1'&&e.key<='6'){sel=+e.key-1;canWiggle=.35;S.rattle()}});
window.addEventListener('resize',()=>{pendingLayout=true});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend().catch(()=>{});else AC.resume().catch(()=>{})});

/* ---------- boot ---------- */
let last=performance.now();
layout();goTitle();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load(`40px ${F_FAT}`,'WALL'),document.fonts.load(`20px ${F_TAG}`,'wake'),document.fonts.load(`800 16px ${F_UI}`,'best')])
  .then(()=>{fontsReady=true;logoC=null;if(state==='title')goTitle()}).catch(()=>{})}

})();
</script>
