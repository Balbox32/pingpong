<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7b1e45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Baaalloon!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one full-bleed canvas; the whole game is drawn in a risograph-sticker style
   whose palette is lifted straight off Nil's striped tee. */
:root{
  --ink:#2a0b1c;      /* outline ink */
  --maroon:#7b1e45;   /* shirt stripe */
  --lemon:#eef38a;    /* shirt stripe */
  --cyan:#38b6e8;     /* shirt print */
  --cream:#fff8e6;    /* Feta's fur */
  --display:"Bagel Fat One","Arial Black",Impact,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--maroon);overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#game{display:block;width:100%;height:100%;touch-action:none;outline:none}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Baaalloon: steer Feta the goat and Nil through the sky. Drag or arrow keys to steer, tap or space to dash."></canvas>
<script>
(() => {
'use strict';

/* ================================================================
   BAAALLOON!  —  starring Nil & Feta the goat
   Hand-drawn entirely with Canvas 2D. No images, no libraries.
   ================================================================ */

const TAU = Math.PI * 2;
const INK = '#2a0b1c', MAROON = '#7b1e45', LEMON = '#eef38a', CYAN = '#38b6e8', CREAM = '#fff8e6';
const SKIN = '#eab38e', HAIR = '#4a2a17', DENIM = '#34477a';
const PINK = '#e8456b', ORANGE = '#ff8a3d', PURPLE = '#8f5bd6', GREEN = '#5fd17a';
const BALLOON_COLS = [PINK, CYAN, LEMON, ORANGE, PURPLE, GREEN];
const DISPLAY = '"Bagel Fat One","Arial Black",Impact,sans-serif';
const MONO = '"DM Mono",ui-monospace,Menlo,monospace';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;

const ZONES = [
  { n: 'The Pasture',       a: 0,    sky: ['#7fd3f2', '#f1f6b0'] },
  { n: 'Cloud Kingdom',     a: 120,  sky: ['#45b3e8', '#c4ebfb'] },
  { n: 'Thunder Belt',      a: 350,  sky: ['#2c0f22', '#7b1e45'] },
  { n: 'Low Orbit',         a: 700,  sky: ['#0b0a24', '#24154a'] },
  { n: 'The Cheese Nebula', a: 1200, sky: ['#170a28', '#5a1d4f'] },
];
const STARE_LINES = ['…seriously?', 'bro.', 'no.', 'ok and?', 'be so for real.', 'not impressed.'];
const VERDICTS = [
  [0,    'meh',   'Nil is unimpressed.'],
  [80,   'stare', 'Nil: “that’s it?”'],
  [250,  'smirk', 'Nil raised one eyebrow. Respect.'],
  [600,  'smile', 'Nil ALMOST smiled!'],
  [1200, 'smile', 'NIL SMILED. Frame this.'],
];
// Balloon cluster slots, relative to the cluster centre
const SLOTS = [[0,0],[-27,8],[27,8],[-14,-22],[14,-22],[-46,24],[46,24],[0,-44],[-32,-40]];
const MAX_BALLOONS = SLOTS.length;
const GROUND = 0;

/* ---------- utils ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const hexCache = {};
const hex = h => hexCache[h] || (hexCache[h] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- canvas ---------- */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let DPR = 1, W = 420, H = 760, S = 1, PW = 420, OX = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const cw = cv.clientWidth || innerWidth, ch = cv.clientHeight || innerHeight;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  S = Math.min(cw / 420, ch / 700);
  W = cw / S; H = ch / S;
  PW = Math.min(W, 560); OX = (W - PW) / 2;
}
addEventListener('resize', resize);
resize();

// Textures: halftone dots + paper grain
function makePattern(size, paint) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  paint(c.getContext('2d'), size); return ctx.createPattern(c, 'repeat');
}
const HALFTONE = makePattern(10, (g) => { g.fillStyle = '#fff'; g.beginPath(); g.arc(5, 5, 1.5, 0, TAU); g.fill(); });
const GRAIN = makePattern(128, (g, s) => {
  const im = g.createImageData(s, s);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = Math.random() < .5 ? 0 : 255;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = Math.random() * 22;
  }
  g.putImageData(im, 0, 0);
});

/* ---------- drawing primitives ---------- */
const E = (x, y, rx, ry, rot = 0) => ctx.ellipse(x, y, rx, ry, rot, 0, TAU);
function rr(x, y, w, h, r) {
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// "Sticker" fill: misregistered drop shadow, flat fill, thick ink outline
function ink(build, fill, lw = 3, shadow = true) {
  if (shadow) {
    ctx.save(); ctx.translate(2, 3); ctx.beginPath(); build();
    ctx.fillStyle = 'rgba(42,11,28,.25)'; ctx.fill(); ctx.restore();
  }
  ctx.beginPath(); build();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke(); }
}
// Risograph text: cyan plate printed slightly off, then ink, then colour
function rtext(str, x, y, size, fill, o = {}) {
  ctx.font = `${size}px ${DISPLAY}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.shadow !== false) { ctx.fillStyle = o.shadow || CYAN; ctx.fillText(str, x + size * .07, y + size * .08); }
  ctx.lineWidth = o.lw || Math.max(3, size * .16); ctx.strokeStyle = INK; ctx.strokeText(str, x, y);
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
function mtext(str, x, y, size, color, align = 'center', spacing = 1.5) {
  ctx.font = `500 ${size}px ${MONO}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}
// The shirt: diagonal wavy maroon / lemon stripes
function stripes(ph, a = MAROON, b = LEMON) {
  ctx.fillStyle = b; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-.32);
  const D = Math.hypot(W, H) / 2 + 60, band = 34, off = ph % (band * 2);
  ctx.fillStyle = a;
  for (let y = -D - band * 2 + off; y < D; y += band * 2) {
    ctx.beginPath();
    for (let x = -D; x <= D; x += 16) ctx.lineTo(x, y + Math.sin(x * .025 + ph * .03) * 10);
    for (let x = D; x >= -D; x -= 16) ctx.lineTo(x, y + band + Math.sin(x * .025 + ph * .03) * 10);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ---------- characters ---------- */
function eye(ex, ey, lid, big, lx) {
  ctx.save(); ctx.translate(ex, ey); ctx.scale(big, big);
  ctx.beginPath(); E(0, 0, 3.7, 3.1); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#5b2f17'; ctx.beginPath(); ctx.arc(lx, .3, 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(lx, .3, 1.15, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(lx - .8, -.5, .7, 0, TAU); ctx.fill();
  if (lid > 0) { ctx.fillStyle = SKIN; ctx.fillRect(-4, -3.4, 8, 6.6 * lid); }
  ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath();
  if (lid >= 1) { ctx.moveTo(-3.7, 0); ctx.quadraticCurveTo(0, 1.2, 3.7, 0); }
  else { const ly = -3.1 + 6.2 * lid; ctx.moveTo(-4.1, ly + .4); ctx.quadraticCurveTo(0, ly - 1.4 * (1 - lid), 4.1, ly + .4); }
  ctx.stroke();
  ctx.restore();
}
const BROWS = {
  meh:   [[-9,-5.4,-2,-5],[2,-5,9,-5.4]],
  stare: [[-9,-7.6,-2,-9],[2,-5,9,-4.4]],
  shock: [[-9,-8.6,-2,-9.6],[2,-9.6,9,-8.6]],
  smirk: [[-9,-6,-2,-6.4],[2,-7.6,9,-8.6]],
  smile: [[-9,-7,-2,-7.6],[2,-7.6,9,-7]],
};
function mouth(m) {
  ctx.lineCap = 'round';
  if (m === 'shock') { ctx.fillStyle = INK; ctx.beginPath(); E(0, 11, 2.4, 3); ctx.fill(); return; }
  if (m === 'smile') {
    ctx.beginPath(); ctx.moveTo(-5.2, 8.6); ctx.quadraticCurveTo(0, 16, 5.2, 8.6); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(-3.6, 8.7, 7.2, 1.6);
    ctx.fillStyle = PINK; ctx.beginPath(); E(0, 12.4, 2.4, 1.1); ctx.fill(); return;
  }
  ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.beginPath();
  if (m === 'smirk') { ctx.moveTo(-3.4, 10.6); ctx.quadraticCurveTo(1, 11.8, 4.4, 8.8); ctx.stroke(); return; }
  if (m === 'stare') { ctx.moveTo(-3.6, 10.5); ctx.lineTo(3.6, 10.2); ctx.stroke(); return; }
  // the signature pout
  ctx.fillStyle = '#d98a86'; ctx.beginPath(); E(0, 10.7, 4.3, 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4.4, 11.1); ctx.quadraticCurveTo(0, 9.9, 4.4, 11.3); ctx.stroke();
}
// Nil's head, radius ~15 at origin
function drawNilHead(mood, t) {
  const blink = (t % 3.7) < .12 && mood !== 'shock';
  ink(() => E(0, -4, 17, 15.5), HAIR, 2.5);
  ink(() => E(-14.2, 2, 3.4, 4.6), SKIN, 2, false);
  ink(() => E(14.2, 2, 3.4, 4.6), SKIN, 2, false);
  ink(() => E(0, 2.5, 13.5, 14.2), SKIN, 2.5, false);
  ctx.fillStyle = mood === 'smile' ? 'rgba(232,69,107,.45)' : 'rgba(232,69,107,.2)';
  ctx.beginPath(); E(-8.4, 7, 3.4, 2); ctx.fill(); ctx.beginPath(); E(8.4, 7, 3.4, 2); ctx.fill();
  ctx.fillStyle = '#6b3a24'; ctx.beginPath(); ctx.arc(-7.4, 5.6, .8, 0, TAU); ctx.fill(); // the mole
  let lid = { meh: .42, stare: .55, shock: 0, smirk: .3, smile: .15 }[mood];
  if (blink) lid = 1;
  const big = mood === 'shock' ? 1.2 : 1, lx = mood === 'stare' ? 0 : Math.sin(t * .7) * .6;
  eye(-5.4, 1.2, lid, big, lx); eye(5.4, 1.2, lid, big, lx);
  ctx.strokeStyle = '#b06f4c'; ctx.lineWidth = 1.3; ctx.beginPath();
  ctx.moveTo(-1.8, 6.6); ctx.quadraticCurveTo(0, 8.2, 1.8, 6.6); ctx.stroke();
  mouth(mood);
  // the swoopy fringe
  ink(() => {
    ctx.moveTo(-15.5, 0); ctx.bezierCurveTo(-19, -13, -9, -21, 2, -20.5); ctx.bezierCurveTo(13, -20, 19.5, -11, 16.5, 2);
    ctx.lineTo(13.5, -3.8); ctx.lineTo(11.8, -.4); ctx.lineTo(9.2, -5.6); ctx.lineTo(5.8, -3.2); ctx.lineTo(3.6, -7.6);
    ctx.lineTo(-1, -5.2); ctx.lineTo(-3.6, -9); ctx.lineTo(-7.6, -6.2); ctx.lineTo(-10.2, -9); ctx.lineTo(-12.6, -4.6);
    ctx.lineTo(-14, -6.5); ctx.closePath();
  }, HAIR, 2.5, false);
  ink(() => { ctx.moveTo(-6, -19); ctx.quadraticCurveTo(-4, -27.5, 2.5, -25); ctx.quadraticCurveTo(-1, -22.5, 1, -20); ctx.closePath(); }, HAIR, 2.2, false);
  ink(() => { ctx.moveTo(3, -20); ctx.quadraticCurveTo(9.5, -27.5, 13.5, -22); ctx.quadraticCurveTo(10, -21, 9.5, -18); ctx.closePath(); }, HAIR, 2.2, false);
  ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 1.1;
  for (const [a, b, c, d] of [[-9, -15, -3, -9.5], [1, -16.5, 7, -8.5], [10, -14, 13.5, -7]]) {
    ctx.beginPath(); ctx.moveTo(a, b); ctx.quadraticCurveTo((a + c) / 2 + 3, (b + d) / 2 - 2, c, d); ctx.stroke();
  }
  ctx.strokeStyle = '#2b170c'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (const b of BROWS[mood]) {
    ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.quadraticCurveTo((b[0] + b[2]) / 2, Math.min(b[1], b[3]) - 1, b[2], b[3]); ctx.stroke();
  }
}
function limb(x1, y1, cx, cy, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2);
  ctx.strokeStyle = INK; ctx.lineWidth = 8.5; ctx.stroke(); ctx.strokeStyle = SKIN; ctx.lineWidth = 5; ctx.stroke();
}
function drawNil(t, o) {
  ink(() => rr(-2, -4, 8, 19, 4), DENIM, 2.5, false);
  ink(() => E(4, 15.5, 6.5, 3.6), '#f4f1f7', 2.2, false);
  limb(-10, -19, -15, -8, -12, 0);
  const torso = () => rr(-12, -27, 24, 29, 9);
  ink(torso, LEMON, 0, true);
  ctx.save(); ctx.beginPath(); torso(); ctx.clip(); ctx.fillStyle = MAROON;
  for (let i = 0; i < 5; i++) {
    const yy = -27 + i * 7.2; ctx.beginPath();
    for (let x = -13; x <= 13; x += 2) ctx.lineTo(x, yy + Math.sin(x * .32 + i * .9) * 1.4 + x * .12);
    for (let x = 13; x >= -13; x -= 2) ctx.lineTo(x, yy + 3.8 + Math.sin(x * .32 + i * .9) * 1.4 + x * .12);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.beginPath(); torso(); ctx.lineWidth = 2.6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.strokeStyle = MAROON; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -28, 5.5, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
  limb(9, -21, 23, -36, 22, -57);
  ink(() => ctx.arc(9.5, -21.5, 4.4, 0, TAU), MAROON, 2, false);
  ink(() => ctx.arc(22, -58, 3.9, 0, TAU), SKIN, 2, false);
  ctx.save(); ctx.translate(0, -41); drawNilHead(o.mood, t); ctx.restore();
}
// Feta the goat with Nil riding. Origin = goat body centre. Hand at (19,-73).
function drawRider(t, o) {
  const legs = [[-19, 9], [-9, 11], [9, 11], [19, 9]];
  legs.forEach(([lx, ly], i) => {
    ctx.save(); ctx.translate(lx, ly);
    ctx.rotate(Math.sin(t * (o.kick ? 10 : 2) + i * 1.9) * (o.kick ? .45 : .06));
    ink(() => rr(-3.6, -2, 7.2, 17, 3.5), CREAM, 2.5, false);
    ctx.fillStyle = INK; ctx.beginPath(); rr(-3.6, 11, 7.2, 5, 2); ctx.fill();
    ctx.restore();
  });
  ink(() => { ctx.moveTo(-25, -7); ctx.quadraticCurveTo(-37, -14, -33, -22); ctx.quadraticCurveTo(-28, -15, -21, -12); ctx.closePath(); }, CREAM, 2.5);
  ink(() => E(0, 0, 29, 17), CREAM, 3);
  ctx.save(); ctx.beginPath(); E(0, 0, 29, 17); ctx.clip();
  ctx.fillStyle = '#d49a62'; ctx.beginPath(); E(-14, -8, 10, 7, .3); ctx.fill(); ctx.beginPath(); E(12, 9, 8, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(42,11,28,.25)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 6; i++) { const x = -18 + i * 7; ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x + 2, 13); ctx.stroke(); }
  ctx.restore();
  // saddle blanket
  ink(() => { ctx.moveTo(-15, -13); ctx.quadraticCurveTo(-3, -19, 9, -14); ctx.lineTo(8, -2); ctx.quadraticCurveTo(-3, 1, -14, -2); ctx.closePath(); }, CYAN, 2.2, false);
  ctx.fillStyle = MAROON; ctx.fillRect(-13, -6, 20, 2.4);
  ctx.save(); ctx.translate(-3, -15); drawNil(t, o); ctx.restore();
  // head
  ctx.save(); ctx.translate(25, -13); ctx.rotate(o.dash ? -.3 : Math.sin(t * 2.2) * .07);
  if (o.dash) { ctx.fillStyle = 'rgba(238,243,138,.6)'; ctx.beginPath(); ctx.arc(-6, -14, 17, 0, TAU); ctx.fill(); }
  for (const [ox, oy] of [[-3, -8], [2, -9]]) {
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.quadraticCurveTo(ox - 6, oy - 14, ox - 16, oy - 11);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
    ctx.strokeStyle = o.dash ? LEMON : '#e2cf9c'; ctx.lineWidth = 4; ctx.stroke();
  }
  ink(() => E(-9, -1, 9, 4, .55), CREAM, 2.5, false);
  ctx.fillStyle = '#f2b8b0'; ctx.beginPath(); E(-9, -1, 5.5, 2, .55); ctx.fill();
  ink(() => E(0, 0, 11.5, 10.5, .15), CREAM, 2.8);
  ink(() => E(10, 4.5, 8, 6.8, .25), '#f7e2c6', 2.5, false);
  ctx.fillStyle = INK; ctx.beginPath(); E(14.5, 2.5, 1.4, .9, .4); ctx.fill();
  if (o.chomp > 0) { const m = Math.abs(Math.sin(o.chomp * 30)); ctx.beginPath(); E(12, 9, 4, 1 + m * 3); ctx.fill(); }
  else { ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(8, 9); ctx.quadraticCurveTo(12, 11, 15, 8.5); ctx.stroke(); }
  ink(() => { ctx.moveTo(4, 9); ctx.lineTo(5, 20); ctx.lineTo(7.5, 15); ctx.lineTo(10, 19.5); ctx.lineTo(11, 10); ctx.closePath(); }, CREAM, 2, false);
  ctx.fillStyle = '#fff'; ctx.beginPath(); E(1.5, -2.5, 4.4, 4); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = '#c99a2e'; ctx.beginPath(); ctx.arc(2.2, -2.3, 2.8, 0, TAU); ctx.fill();
  ctx.fillStyle = INK; ctx.fillRect(-.3, -3.1, 5, 1.6); // goats have sideways pupils
  ctx.restore();
  ink(() => ctx.arc(17, 3, 3.6, 0, TAU), LEMON, 2, false); // bell
}
function drawBalloon(x, y, col, r = 15) {
  ink(() => E(x, y, r, r * 1.18), col, 3);
  const by = y + r * 1.18;
  ink(() => { ctx.moveTo(x - 4, by + 5); ctx.lineTo(x, by - 1); ctx.lineTo(x + 4, by + 5); ctx.closePath(); }, col, 2, false);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); E(x - r * .4, y - r * .45, r * .2, r * .36, -.5); ctx.fill();
}
function drawCloud(x, y, s, fill, alpha) {
  const c = [[0, 0, 22], [24, 4, 18], [-24, 5, 16], [8, -12, 18], [-10, -8, 15]];
  ctx.globalAlpha = alpha;
  ctx.beginPath(); for (const [cx, cy, r] of c) { ctx.moveTo(x + cx * s + 3 + r * s, y + cy * s + 4); ctx.arc(x + cx * s + 3, y + cy * s + 4, r * s, 0, TAU); }
  ctx.fillStyle = 'rgba(42,11,28,.16)'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = INK;
  for (const [cx, cy, r] of c) { ctx.beginPath(); ctx.arc(x + cx * s, y + cy * s, r * s, 0, TAU); ctx.stroke(); }
  ctx.beginPath(); for (const [cx, cy, r] of c) { ctx.moveTo(x + cx * s + r * s, y + cy * s); ctx.arc(x + cx * s, y + cy * s, r * s, 0, TAU); }
  ctx.fillStyle = fill; ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------- audio: everything synthesised live ---------- */
const AU = {
  ac: null, step: 0, next: 0, zone: 0, musicOn: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = this.ac = new AC();
    this.master = ac.createGain(); this.master.gain.value = muted ? 0 : .9; this.master.connect(ac.destination);
    this.sfx = ac.createGain(); this.sfx.gain.value = .8; this.sfx.connect(this.master);
    this.mus = ac.createGain(); this.mus.gain.value = .2; this.mus.connect(this.master);

/* ---------- state ---------- */
let muted = store.get('baaalloon.muted', false);

function addBalloon(c, x, y) {

}
function reset() {
  P = { x: PW / 2, px: PW / 2, y: GROUND - 26, vy: 0, balloons: [], dashT: 0, dashCD: 0, inv: 0, shield: 0,
        mood: 'meh', moodT: 0, chomp: 0, tilt: 0 };

  ents = []; parts = []; texts = [];

reset();

const altOf = y => (GROUND - y) / 10;
const zoneAt = alt => { let z = 0; for (let i = 0; i < ZONES.length; i++) if (alt >= ZONES[i].a) z = i; return z; };

/* ---------- particles & pop-text ---------- */
function burst(x, y, cols, n, sp = 180, type = 'dot', grav = 400) {
  for (let i = 0; i < n && parts.length < 400; i++) {
    const a = rand(0, TAU), v = rand(.3, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.4, .9), max: 1, c: Array.isArray(cols) ? pick(cols) : cols,

}
function popText(x, y, str, col = LEMON, size = 22) { texts.push({ x, y, str, col, size, t: 0 }); }

/* ---------- spawning ---------- */
function spawnRow(y) {
  const alt = altOf(y), z = zoneAt(alt), d = 1 + alt / 1500;
  if (alt > 28 && Math.random() < Math.min(.8, .4 + alt / 1800)) spawnHazard(y, z, d, alt);
  if (Math.random() < .55 || alt < 28) spawnPickup(y - rand(20, 50), z, alt);
}
function spawnHazard(y, z, d, alt) {
  const r = Math.random();
  let k;
  if (z === 0) k = alt > 60 && r < .4 ? 'bee' : 'bird';
  else if (z === 1) k = r < .45 ? 'bird' : r < .75 ? 'bee' : 'storm';
  else if (z === 2) k = r < .55 ? 'storm' : r < .85 ? 'bird' : 'bee';
  else if (z === 3) k = r < .5 ? 'sat' : 'ufo';
  else k = r < .35 ? 'ufo' : r < .7 ? 'sat' : r < .85 ? 'bee' : 'storm';
  if (k === 'bird') ents.push({ k, x: rand(20, PW - 20), y, dir: Math.random() < .5 ? -1 : 1, sp: rand(70, 130) * d, r: 15, t: rand(0, 9) });
  else if (k === 'bee') { const cx = rand(60, PW - 60); for (let i = 0; i < 3; i++) ents.push({ k, cx, cy: y, ph: i * TAU / 3, r: 9, t: rand(0, 9), x: cx, y, d }); }
  else if (k === 'storm') ents.push({ k, bx0: rand(60, PW - 60), x: 0, y, st: 'idle', tm: rand(.4, 2), bx: 0, r: 0, t: rand(0, 9) });
  else if (k === 'ufo') ents.push({ k, bx: rand(80, PW - 80), x: 0, y, t: rand(0, 9), beam: false, bt: rand(1, 2.4), r: 26 });
  else if (k === 'sat') ents.push({ k, x: rand(30, PW - 30), y, vx: (Math.random() < .5 ? -1 : 1) * rand(25, 55) * d, rot: rand(0, TAU), r: 20, t: 0 });
}
function spawnPickup(y, z, alt) {
  const lowOnAir = P.balloons.length < 3;
  const r = Math.random();
  let type;
  if (r < .04) type = 'apple';
  else if (r < (lowOnAir ? .42 : .2)) type = 'balloon';
  else if (z >= 3 && r < .6) type = 'cheese';
  else if (z === 0 && r < .55) type = 'clover';

}

/* ---------- player actions ---------- */
function handPos() {
  const c = Math.cos(P.tilt), s = Math.sin(P.tilt);
  return { x: P.x + 19 * c + 73 * s, y: P.y + 19 * s - 73 * c };
}
function hitPlayer(x, y, r) {
  if (Math.hypot(x - P.x, y - P.y) < r + 24) return -1;
  if (Math.hypot(x - P.x + 3, y - P.y + 55) < r + 16) return -1;
  for (let i = P.balloons.length - 1; i >= 0; i--) { const b = P.balloons[i]; if (Math.hypot(x - b.x, y - b.y) < r + 14) return i; }
  return null;
}
function popBalloon(i) {
  const b = P.balloons.splice(i, 1)[0]; if (!b) return;
  stats.popped++;
  burst(b.x, b.y, b.c, 22, 260, 'shred'); burst(b.x, b.y, '#fff', 6, 120);
  popText(b.x, b.y, 'POP!', '#fff', 26);
  AU.pop(); shake = 10; buzz(40);
  if (P.balloons.length === 0) {
    popText(P.x, P.y - 70, 'UH OH!', PINK, 30); AU.bleat(1.5);
    // A drifting rescue balloon in the fall path, if you can reach it
    ents.push({ k: 'pick', type: 'balloon', x: clamp(P.x + rand(-70, 70), 30, PW - 30), y: Math.min(P.y + 110, camY + H - 70), r: 15, t: 0, c: pick(BALLOON_COLS), rescue: true });
  }
}
function hurt(i) {

  if (!P.balloons.length) return;
  popBalloon(i >= 0 ? i : P.balloons.length - 1);
  P.inv = 1.1; P.mood = 'shock'; P.moodT = .9; combo = 0;
}
function dash() {
  if (state !== 'play' || P.dashCD > 0) return;
  P.dashCD = .9; AU.bleat(); AU.whoosh(); buzz(15);
  if (!P.balloons.length) { P.vy = -330; popText(P.x + 30, P.y - 30, 'FLAP!', LEMON, 22); }
  else { P.dashT = .28; popText(P.x + 34, P.y - 24, 'BAAA!', LEMON, 24); }
  P.mood = 'smirk'; P.moodT = .5;
  for (let i = 0; i < 8; i++) parts.push({ x: P.x + rand(-30, 30), y: P.y + rand(0, 30), vx: 0, vy: rand(200, 360), life: .35, max: 1, c: '#fff', s: rand(14, 30), type: 'line', grav: 0 });
}
function smash(e) {
  e.dead = true; stats.bonked++;
  combo++; comboT = 2.2; const pts = 30 * mult(); bonus += pts; sass = Math.min(100, sass + 6);
  burst(e.x, e.y, [LEMON, '#fff', CYAN], 18, 260, 'star', 0);
  popText(e.x, e.y - 10, `BONK! +${pts}`, '#fff', 22);
  AU.bonk(); shake = 7; buzz(25);
}
function collect(e) {
  e.dead = true;
  const map = { can: [10, 7, 'NOM'], clover: [5, 4, 'MUNCH'], apple: [100, 30, 'GOLDEN!'], cheese: [20, 8, 'CHEESE!'] };
  if (e.type === 'balloon') {
    if (P.balloons.length < MAX_BALLOONS) { addBalloon(e.c, e.x, e.y); popText(e.x, e.y - 20, e.rescue ? 'SAVED!' : '+1 BALLOON', '#fff', 20); }
    else { bonus += 25; popText(e.x, e.y - 20, '+25', '#fff', 20); }
    AU.get(); burst(e.x, e.y, e.c, 10, 140); P.mood = 'smirk'; P.moodT = .6; return;
  }

  bonus += total; sass = Math.min(100, sass + ss); stats.eaten++;
  popText(e.x, e.y - 16, m > 1 ? `${word} +${pts}×${m}` : `${word} +${pts}`, e.type === 'apple' ? LEMON : '#fff', e.type === 'apple' ? 26 : 19);
  burst(e.x, e.y, e.type === 'apple' ? [LEMON, ORANGE, '#fff'] : ['#fff', LEMON, '#cfd6e0'], 10, 150);

function startStare() {
  if (state !== 'play' || sass < 100) return;

  stareLine = pick(STARE_LINES); AU.stare(); buzz([30, 50, 80]);
}

  stareDone = true; flash = 1; shake = 14;

    if (e.k === 'pick' || e.dead) continue;
    const ey = e.k === 'storm' ? e.y : e.y;
    if (ey > camY - 60 && ey < camY + H + 60) {
      e.dead = true; n++;
      const ex = e.k === 'storm' ? e.bx0 : e.x;
      burst(ex, ey, ['#9a9aa6', '#c8c8d2', '#6c6c78'], 14, 220, 'shred');
      for (let i = 0; i < 3; i++) ents.push({ k: 'pick', type: 'can', x: ex + rand(-15, 15), y: ey + rand(-15, 15), r: 14, t: rand(0, 9), magnet: true, vx: rand(-200, 200), vy: rand(-200, 100) });
    }
  }
  bonus += n * 50;

function startGame() {
  AU.init(); reset(); state = 'play'; AU.musicOn = true;

function togglePause() { if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play'; }

/* ---------- update ---------- */
let dragDX = 0;
const keys = { left: false, right: false };

function updateEnt(e, dt) {
  e.t += dt;
  switch (e.k) {
    case 'bird':
      e.x += e.dir * e.sp * dt; e.y += Math.sin(e.t * 3) * 14 * dt;
      if (e.x < -40 && e.dir < 0 || e.x > PW + 40 && e.dir > 0) e.dir *= -1;
      break;
    case 'bee':
      e.cx += clamp(P.x - e.cx, -1, 1) * 22 * e.d * dt;
      e.x = e.cx + Math.cos(e.t * 2 + e.ph) * 38; e.y = e.cy + Math.sin(e.t * 4 + e.ph) * 14;
      break;
    case 'storm': {
      e.x = e.bx0 + Math.sin(e.t * .4) * 20;
      e.tm -= dt;
      if (e.tm <= 0) {
        if (e.st === 'idle') { e.st = 'charge'; e.tm = .9; e.bx = clamp(e.x + rand(-30, 30), 20, PW - 20); }
        else if (e.st === 'charge') { e.st = 'zap'; e.tm = .38; if (e.y > camY - 40 && e.y < camY + H) { AU.zap(); shake = Math.max(shake, 5); } }
        else { e.st = 'idle'; e.tm = rand(1.3, 2.4); }
      }
      if (e.st === 'zap' && P.inv <= 0 && P.dashT <= 0 && P.shield <= 0) {
        const inBolt = (x, y) => Math.abs(x - e.bx) < 16 && y > e.y + 15 && y < e.y + 300;
        if (inBolt(P.x, P.y) || inBolt(P.x, P.y - 55)) { hurt(-1); popText(P.x, P.y - 40, 'ZAP!', LEMON, 26); }
        else for (let i = P.balloons.length - 1; i >= 0; i--) { const b = P.balloons[i]; if (inBolt(b.x, b.y)) { hurt(i); popText(b.x, b.y - 20, 'ZAP!', LEMON, 26); break; } }
      }
      break;
    }
    case 'ufo': {
      e.x = e.bx + Math.sin(e.t * .9) * Math.min(90, PW / 2 - 60);
      e.bt -= dt; if (e.bt <= 0) { e.beam = !e.beam; e.bt = e.beam ? 1.6 : 2.2; }
      if (e.beam) {
        const dy = P.y - e.y;
        if (dy > 10 && dy < 240 && Math.abs(P.x - e.x) < 12 + dy * .26) {
          P.x += (e.x - P.x) * 2.4 * dt; P.vy -= 240 * dt;
          if (Math.random() < .3) parts.push({ x: P.x + rand(-20, 20), y: P.y + 10, vx: 0, vy: -120, life: .5, max: 1, c: GREEN, s: 3, type: 'dot', grav: 0 });
        }
      }
      break;
    }
    case 'sat':
      e.x += e.vx * dt; e.rot += dt * .8;
      if (e.x < 20 && e.vx < 0 || e.x > PW - 20 && e.vx > 0) e.vx *= -1;
      break;
    case 'met':
      if (e.warn > 0) { e.warn -= dt; e.y = camY - 50; }
      else {
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (Math.random() < .7) parts.push({ x: e.x + rand(-6, 6), y: e.y - 10, vx: rand(-20, 20), vy: -40, life: .4, max: 1, c: pick([ORANGE, LEMON, PINK]), s: rand(3, 7), type: 'dot', grav: 0 });
      }
      break;
    case 'pick':
      if (e.magnet) {
        e.vx += (P.x - e.x) * 14 * dt; e.vy += (P.y - 20 - e.y) * 14 * dt;
        e.vx *= Math.exp(-3 * dt); e.vy *= Math.exp(-3 * dt);
        e.x += e.vx * dt; e.y += e.vy * dt;
      } else if (e.type === 'balloon') e.y -= (e.rescue ? 8 : 18) * dt;
      break;
  }
}

function updatePlay(dt) {
  // steering
