<title>Bloomhop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-bleed portrait stage. The canvas world sits underneath; the HUD and cards float over it as DOM. */
:root{
  --ink:#3d2350; --cream:#fff8ee; --petal:#ff7fa6; --leaf:#44c57f; --sun:#ffd166; --sky:#8fe3ff; --night:#1c1033;
  --display:'Fredoka','Baloo 2',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--display);font-weight:600;overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100vw;overflow:hidden;background:#ffd9c2}
#stage.framed{top:14px;bottom:14px;border-radius:30px;box-shadow:0 0 0 6px #2c1a4d,0 30px 80px #0008}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer button{pointer-events:auto;font-family:inherit;font-weight:700;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.outlined{text-shadow:0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 5px 0 #3d235055}

/* HUD */
#hud{align-items:center;gap:2px;transition:opacity .3s}
#hud .row{align-self:stretch;display:flex;justify-content:space-between;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:#3d2350b8;color:var(--cream);padding:6px 13px 6px 11px;border-radius:99px;font-size:17px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.drop{width:11px;height:11px;background:var(--sky);border:2px solid #fff;border-radius:0 55% 55% 55%;transform:rotate(45deg);flex:none}
.round{width:40px;height:40px;border-radius:50%;background:#3d2350b8;color:var(--cream);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.round svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#score{font-size:64px;line-height:1;font-weight:700;margin-top:-30px;font-variant-numeric:tabular-nums}
#score.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.18)}}
#streak{font-size:17px;background:var(--petal);color:#fff;padding:3px 13px;border-radius:99px;border:2.5px solid var(--ink);opacity:0;transform:scale(.6);transition:all .2s cubic-bezier(.3,1.8,.5,1)}
#streak.on{opacity:1;transform:none}
#streak.fever{background:linear-gradient(90deg,#ff7fa6,#ffb347,#ffd166,#6fdc8c,#6ec3ff,#b08bff);background-size:200%;animation:slide 1.2s linear infinite}
@keyframes slide{to{background-position:200%}}

.thin{text-shadow:0 1.5px 0 var(--ink),0 -1.5px 0 var(--ink),1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink),0 3px 0 #3d235066}
#zone{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:30px;font-weight:700;opacity:0;pointer-events:none}
#zone small{display:block;font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
#zone.show{animation:zone 2.6s ease both}
@keyframes zone{0%{opacity:0;transform:translateY(14px) scale(.9)}15%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-12px)}}

/* Title */
#title{align-items:center;transition:opacity .35s,transform .35s}
#title.away{opacity:0;transform:translateY(-20px)}
#title .row{align-self:stretch;display:flex;justify-content:space-between;align-items:center}
#logo{margin-top:7vh;font-size:min(19vw,78px);line-height:1;font-weight:700;letter-spacing:-.01em;display:flex}
#logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.22s);
  text-shadow:0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),2.4px 2.4px 0 var(--ink),-2.4px 2.4px 0 var(--ink),2.4px -2.4px 0 var(--ink),-2.4px -2.4px 0 var(--ink),0 9px 0 var(--ink)}
@keyframes bob{50%{transform:translateY(-7px) rotate(var(--r,2deg))}}
#tag{margin-top:16px;font-size:18px;text-align:center;text-wrap:balance}
#best{margin-top:10px;font-size:15px;opacity:.95}
.grow{flex:1}
#tap{font-size:24px;font-weight:700;animation:pulse 1.3s ease-in-out infinite;text-align:center}
#tap small{display:block;letter-spacing:.01em;font-size:14px;font-weight:600;margin-top:6px;opacity:.95}
@keyframes pulse{50%{transform:scale(1.07)}}
#skinBtn{margin-top:18px;background:var(--cream);color:var(--ink);font-size:17px;padding:10px 20px;border-radius:99px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
button:active{transform:translateY(2px)}

/* Cards */
.veil{align-items:center;justify-content:center;background:#1c103388;pointer-events:auto;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:min(100%,330px);background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:22px 20px 20px;text-align:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:translateY(40px) scale(.85);opacity:0}}
.card h2{margin:0;font-size:25px;font-weight:700;text-wrap:balance}
.card p{text-wrap:balance;margin:4px 0 0;font-size:15px;font-weight:500;opacity:.8}
#final{font-size:74px;line-height:1.05;font-weight:700;color:var(--petal);font-variant-numeric:tabular-nums;-webkit-text-stroke:0}
#newbest{display:inline-block;background:var(--sun);border:2.5px solid var(--ink);border-radius:99px;padding:2px 12px;font-size:14px;transform:rotate(-4deg);animation:pulse 1s infinite}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 18px}
.stats div{background:#3d235012;border-radius:14px;padding:8px 2px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;opacity:.7}
.big{width:100%;background:var(--petal);color:#fff;font-size:23px;padding:13px;border-radius:20px;border:3.5px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.ghost{margin-top:14px;background:none;color:var(--ink);font-size:16px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 16px}
.skin{background:#fff;border:3px solid #3d235030;border-radius:18px;padding:6px 2px 8px;color:var(--ink);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.skin canvas{position:static;width:64px;height:64px}
.skin.sel{border-color:var(--ink);background:#ffe9f0;box-shadow:0 4px 0 var(--ink)}
.skin.locked canvas{filter:grayscale(.7) opacity(.55)}
.skin .cost{font-size:13px;display:flex;align-items:center;gap:5px;font-weight:600;opacity:.85}
.skin .cost .drop{width:8px;height:8px;border-color:var(--ink);border-width:1.5px}
.skin.no{animation:no .3s}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wallet{display:inline-flex;margin-top:8px;background:var(--ink)}
@media (prefers-reduced-motion:reduce){#logo span,#tap,#newbest{animation:none}}
</style>

<div id="stage">
  <canvas id="c"></canvas>

  <div class="layer" id="hud" hidden>
    <div class="row">
      <div class="chip"><i class="drop"></i><span id="dew">0</span></div>
      <button class="round" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
    <div id="score" class="outlined">0</div>
    <div id="streak">Bloom streak ×2</div>
  </div>
  <div id="zone" class="outlined"><small>Now entering</small><span id="zoneName"></span></div>

  <div class="layer" id="title">
    <div class="row">
      <div class="chip"><i class="drop"></i><span id="dewT">0</span></div>
      <button class="round" id="muteBtn" aria-label="Sound on or off"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
    </div>
    <div id="logo" aria-label="Bloomhop"></div>
    <div id="tag" class="thin">Hop from planet to planet.<br>Run a full lap to make it bloom.</div>
    <div id="best" class="thin"></div>
    <div class="grow"></div>
    <div id="tap" class="outlined">Tap to hop<small class="thin">Tap when the dots point at a planet</small></div>
    <button id="skinBtn">Choose your hopper</button>
  </div>

  <div class="layer veil" id="over" hidden>
    <div class="card">
      <h2 id="overTitle">The Gloom caught up</h2>
      <p id="overLine"></p>
      <div id="final">0</div>
      <div id="newbest" hidden>New best!</div>
      <div class="stats">
        <div><b id="sH">0</b><span>Metres</span></div>
        <div><b id="sB">0</b><span>Blooms</span></div>
        <div><b id="sS">0</b><span>Streak</span></div>
        <div><b id="sD">0</b><span>Dew</span></div>
      </div>
      <button class="big" id="againBtn">Hop again</button>
      <button class="ghost" id="overSkins">Choose your hopper</button>
    </div>
  </div>

  <div class="layer veil" id="skins" hidden>
    <div class="card">
      <h2>Choose your hopper</h2>
      <div class="chip wallet"><i class="drop"></i><span id="dewS">0</span></div>
      <div class="grid" id="skinGrid"></div>
      <button class="big" id="skinsDone">Done</button>
    </div>
  </div>

  <div class="layer veil" id="paused" hidden>
    <div class="card">
      <h2>Paused</h2>
      <p>The planets are waiting for you.</p>
      <div style="height:16px"></div>
      <button class="big" id="resumeBtn">Keep hopping</button>
      <button class="ghost" id="pMute">Sound: on</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2, PI=Math.PI;
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const backOut=x=>{x=clamp(x,0,1);return 1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2)};
const INK='#3d2350', FONT="Fredoka,'Baloo 2',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif";
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- save ---------- */
const KEY='bloomhop.v1';
const save={best:0,dew:0,owned:['sprout'],skin:'sprout',muted:false,runs:0};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

/* ---------- canvas ---------- */
const stage=$('stage'), cv=$('c'), ctx=cv.getContext('2d');
const W=400; let H=800, S=1;
function resize(){
  const vw=Math.max(innerWidth,200), vh=Math.max(innerHeight,300);
  const framed=vw>vh*0.62+60;
  const h=framed?vh-28:vh, w=framed?Math.round(h*0.56):vw;
  stage.style.width=w+'px'; stage.classList.toggle('framed',framed);
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  S=cv.width/W; H=cv.height/S;
}
addEventListener('resize',resize); resize();

/* ---------- audio ---------- */
let AC=null, master, sfxBus, musBus, musFilter, noiseBuf, L={}, tr=0, lvl=-9;
const PENT=[0,2,4,7,9];
const note=i=>261.63*Math.pow(2,(PENT[((i%5)+5)%5]+12*Math.floor(i/5)+tr)/12);
const mHz=m=>440*Math.pow(2,(m-69+tr)/12);
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=5; comp.connect(AC.destination);
    master=AC.createGain(); master.gain.value=save.muted?0:1; master.connect(comp);
    sfxBus=AC.createGain(); sfxBus.gain.value=.5; sfxBus.connect(master);
    musFilter=AC.createBiquadFilter(); musFilter.type='lowpass'; musFilter.frequency.value=16000; musFilter.Q.value=.4; musFilter.connect(master);
    musBus=AC.createGain(); musBus.gain.value=1; musBus.connect(musFilter);
    // dotted-eighth echo for the lead and sparkle layers
    const d=AC.createDelay(1), fb=AC.createGain(), wet=AC.createGain();
    d.delayTime.value=60/BPM*.75; fb.gain.value=.32; wet.gain.value=.3; d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(musBus);
    for(const k of ['lead','pad','bass','drum','hat','arp']){ L[k]=AC.createGain(); L[k].gain.value=0; L[k].connect(musBus) }
    L.lead.connect(d); L.arp.connect(d);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate); const nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    nextStep=AC.currentTime+.12; setInterval(schedule,80);
  }catch(e){AC=null}
}
function tone(f,dur,type,vol,delay,to,bus){
  if(!AC) return;
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(bus||sfxBus); o.start(t); o.stop(t+dur+.05);
}
function hiss(dur,vol,delay,hp,bus){
  const t=AC.currentTime+delay, src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  src.buffer=noiseBuf; f.type='highpass'; f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(bus); src.start(t,Math.random()*.3,dur+.02);
}
const sfx={
  hop(){tone(420,.14,'sine',.22,0,880)},
  land(n){tone(note(5+n),.28,'triangle',.25); tone(note(5+n)*2,.2,'sine',.08)},
  wall(){tone(180,.12,'sine',.25,0,300)},
  bloom(n){for(let i=0;i<4;i++) tone(note(6+n+i*2),.34,'sine',.17,i*.065); tone(note(6+n)*.5,.4,'triangle',.14)},
  dew(n){tone(note(12+(n%8)),.16,'sine',.14)},
  bonk(){tone(170,.2,'square',.12,0,70)},
  crumble(){for(let i=0;i<5;i++) tone(rand(120,300),.08,'square',.06,i*.03)},
  pop(){tone(900,.18,'sine',.25,0,200); tone(1400,.3,'sine',.12,.05,2400)},
  power(){for(let i=0;i<6;i++) tone(note(8+i),.2,'triangle',.14,i*.05)},
  lost(){tone(330,.18,'triangle',.1,0,220)},
  die(){tone(440,.5,'triangle',.25,0,90); tone(220,.7,'sine',.2,.1,55)},
  ui(){tone(700,.08,'sine',.15,0,1000)},
  buy(){for(let i=0;i<5;i++) tone(note(10+i),.22,'sine',.16,i*.06)}
};
/* ---------- theme song: "Hop Along, Little Sprout" ----------
   A swung music-box tune in two sections (bouncy A, wistful B), written as MIDI notes on an
   eighth-note grid (N = hold). Layers fade in with how well you are playing: the title has the
   tune, pads and bass; hopping adds hats and drums; a streak brings the full kit; a Super Bloom
   streak adds a sparkling arpeggio. Each sky zone lifts the key. */
const BPM=112, N=null;
const SONG={
  A:{ch:['C','C','G','G','Am','Am','F','F','C','C','G','G','F','G','C','C'],
     mel:[76,79,84,79,76,N,79,N,  74,79,83,79,74,N,79,N,  72,76,81,76,72,N,76,81,  81,N,79,77,76,N,74,N,
          76,79,84,79,76,N,79,N,  74,79,83,86,83,N,79,N,  81,N,84,81,83,N,86,N,   84,N,N,N,79,N,72,N]},
  A2:{ch:['C','C','G','G','Am','Am','F','F','C','C','G','G','F','G','C','C'],
     mel:[76,79,84,79,76,N,79,N,  74,79,83,79,74,N,79,N,  72,76,81,76,84,N,81,N,  81,N,79,77,76,77,79,N,
          88,N,84,N,79,N,84,N,    86,N,83,N,79,N,83,N,    81,84,89,84,83,86,91,N,  84,N,N,N,N,N,0,0]},
  B:{ch:['F','F','G','G','Em','Em','Am','Am','F','F','G','G','F','F','G','G'],
     mel:[81,N,N,84,81,N,77,N,    83,N,N,86,83,N,79,N,    79,N,76,79,83,N,81,79,   81,N,N,N,76,N,72,76,
          81,N,N,84,81,N,77,N,    83,N,N,86,83,N,86,N,    88,N,86,84,81,N,84,N,    86,N,N,83,86,N,N,N]}
};
const CHD={C:[48,60,64,67],G:[43,59,62,67],Am:[45,60,64,69],F:[41,60,65,69],Em:[40,59,64,67]};
const ORDER=['A','A2','B','A2'], KEYS=[0,2,4,-1,2,5];
let nextStep=0, step=0, secI=0;
function schedule(){
  if(!AC||AC.state!=='running'||paused){ if(AC) nextStep=Math.max(nextStep,AC.currentTime+.1); return; }
  const base=60/BPM/2;
  while(nextStep<AC.currentTime+.3){
    const s=step, d=Math.max(0,nextStep-AC.currentTime), sec=SONG[ORDER[secI%ORDER.length]];
    if(s===0) tr=KEYS[zoneI%KEYS.length];
    const c=CHD[sec.ch[s>>2]], h=s&3, b=s&7, len=(s&1)?base*.84:base*1.16;
    // lead: a plucked music box, two slightly detuned voices and a soft octave chime
    const m=sec.mel[s];
    if(m){ let n=1; while(s+n<64&&sec.mel[s+n]===null) n++;
      const f=mHz(m), T=Math.min(n*base+.3,1.2);
      tone(f,T,'triangle',.15,d,0,L.lead); tone(f*1.005,T,'sine',.08,d,0,L.lead); tone(f*2,.16,'sine',.045,d,0,L.lead) }
    // pad: the chord, re-struck when it changes and at each bar
    if(h===0&&(b===0||sec.ch[s>>2]!==sec.ch[(s>>2)-1])) for(let i=1;i<4;i++) tone(mHz(c[i]),base*7,'triangle',.04,d+i*.012,0,L.pad);
    // bass: root, octave bounce, and a fifth to lead into the next chord
    if(h===0) tone(mHz(c[0]),base*1.9,'triangle',.24,d,0,L.bass);
    if(h===2) tone(mHz(c[0]+12),base*.9,'triangle',.15,d,0,L.bass);
    if(h===3&&((s>>2)&1)) tone(mHz(c[0]+7),base*.8,'triangle',.13,d,0,L.bass);
    // drums: soft kick, brushed snare, swung hats, a little fill at the end of each section
    if(b===0||b===4||(b===3&&((s>>3)&1))) tone(150,.2,'sine',b===3?.25:.5,d,42,L.drum);
    if(b===2||b===6||s>=62){ hiss(.13,.2,d,1700,L.drum); tone(230,.07,'triangle',.1,d,150,L.drum) }
    hiss(.035,(s&1)?.1:.05,d,7000,L.hat);
    // sparkle: sixteenth-note chord tones climbing two octaves
    for(let k=0;k<2;k++){ const i=s*2+k; tone(mHz(c[1+i%3]+12+(i%6>2?12:0)),.13,'sine',.04,d+k*len/2,0,L.arp) }
    nextStep+=len; if(++step>=64){ step=0; secI++ }
  }
}
function mixMusic(){
  const l=state==='dead'?-1:state==='menu'?0:1+(streak>=2)+(streak>=5);
  if(l===lvl||!AC) return; lvl=l;
  const t=AC.currentTime, set=(k,v)=>L[k].gain.setTargetAtTime(v,t,.3);
  set('lead',l<0?.6:1); set('pad',1); set('bass',l<0?.5:l===0?.8:1);
  set('hat',l>=1?1:0); set('drum',l>=2?1:l===1?.55:0); set('arp',l>=3?1:0);
  musFilter.frequency.setTargetAtTime(l<0?700:16000,t,l<0?.25:.4);
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- skins ---------- */
const SKINS=[
 {id:'sprout',name:'Sprout',cost:0,body:'#f3fff0',belly:'#ffffff',foot:'#ffb86b',cheek:'#ff9fbd'},
 {id:'mochi',name:'Mochi',cost:40,body:'#ffd0e0',belly:'#fff1f6',foot:'#ff9fbd',cheek:'#ff7fa6'},

function drawChar(c,sk,o){

    c.beginPath();c.ellipse(0,0,12,11,0,0,TAU)}

  if(id==='tango'){ for(const s of[-1,1]){c.beginPath();c.moveTo(s*9.5,1);c.lineTo(s*15,-.5);c.moveTo(s*9.5,3);c.lineTo(s*15,4);c.stroke()} }

function makePlanet(x,y,r,type){
  const N=Math.max(12,Math.round(TAU*r/9));
  if(!palBag.length) palBag=[0,1,2,3,4,5].sort(()=>Math.random()-.5);
  const p={x,y,r,type,N,pal:PALS[palBag.pop()],cov:new Uint8Array(N),g:new Float32Array(N),fl:new Uint8Array(N),nCov:0,
    bloomed:false,awake:false,sq:0,sqV:0,ph:rand(0,TAU),blinkT:rand(1,4),crT:0,dead:false,baseX:x,amp:0,sp:0,hit:0,
    spots:[0,1,2].map(()=>({a:rand(0,TAU),d:rand(.25,.6),r:rand(.1,.2)}))};
  for(let i=0;i<N;i++) p.fl[i]=(i%3===0)?1+(Math.random()*2|0):0;
  if(type==='drift'){ p.amp=Math.min(rand(40,80),Math.max(0,Math.min(x-r-16,W-r-16-x))); if(p.amp<25){p.baseX=clamp(x,r+50,W-r-50);p.amp=30} p.sp=rand(.8,1.4) }
  return p;
}
function genNext(){
  const d=clamp(-lastP.y/9000,0,1), n=genN++;
  let type='normal'; const roll=Math.random();
  if(n>5&&roll<.14+.1*d) type='drift'; else if(n>9&&roll<.3+.16*d) type='cookie';
  const r=type==='cookie'?rand(34,44):rand(lerp(40,31,d),lerp(58,47,d));
  let gap=rand(lerp(55,85,d),lerp(100,150,d)), spread=.95;
  if(type==='drift'||lastP.type==='drift'){spread=.3;gap+=25}
  const a=-PI/2+rand(-1,1)*spread, dist=lastP.r+r+gap;
  let x=clamp(lastP.baseX+Math.cos(a)*dist,r+24,W-r-24), y=lastP.y+Math.sin(a)*dist;
  const dx=x-lastP.baseX, minD=lastP.r+r+50;
  if(Math.hypot(dx,y-lastP.y)<minD) y=lastP.y-Math.sqrt(Math.max(400,minD*minD-dx*dx));
  y=Math.min(y,lastP.y-(lastP.r+r)*.55-30);
  const p=makePlanet(x,y,r,type); planets.push(p);
  // dew trail between the two planets
  const L=Math.hypot(p.x-lastP.x,p.y-lastP.y), ux=(p.x-lastP.x)/L, uy=(p.y-lastP.y)/L;
  if(Math.random()<.62) for(const f of[.3,.5,.7]){ const s=lastP.r+PR+(L-lastP.r-p.r-2*PR)*f; dews.push({x:lastP.x+ux*s,y:lastP.y+uy*s,ph:rand(0,TAU)}) }
  // side extras: grumps, bubbles, comets
  const mx=clamp(W-(p.x+lastP.x)/2+rand(-30,30),40,W-40), my=(p.y+lastP.y)/2;
  const free=(x,y,m)=>planets.every(q=>Math.hypot(q.baseX-x,q.y-y)>q.r+q.amp+m);
  if(n>12&&Math.random()<.2+.14*d&&free(mx,my,74)){ planets.push(makePlanet(mx,my,rand(19,25),'grump')) }
  else if(!pl.shield&&n-lastBubble>13&&Math.random()<.16&&free(mx,my,30)){ items.push({x:mx,y:my,k:'bubble',ph:0}); lastBubble=n }
  else if(n-lastComet>26&&Math.random()<.12&&free(mx,my,30)){ items.push({x:mx,y:my,k:'comet',ph:0}); lastComet=n }
  else if(Math.random()<.25&&free(mx,my,26)) dews.push({x:mx,y:my,ph:rand(0,TAU)});
  lastP=p;
}

function markCov(p,a){
  let i=Math.floor(((a%TAU)+TAU)%TAU/TAU*p.N)%p.N;
  if(p.cov[i]) return;
  p.cov[i]=1; p.nCov++;
  if(p.nCov===p.N&&!p.bloomed) fullBloom(p);
}
function fullBloom(p){
  p.bloomed=true; p.sqV-=8; blooms++; streak++; bestStreak=Math.max(bestStreak,streak);
  const pts=10*streak; bonus+=pts;
  pop(p.x,p.y-p.r-30,'+'+pts,'#fff',26);
  burst(p.x,p.y,26,[...p.pal.f,'#ff9eb5','#fff'],260,1,5);
  part({x:p.x,y:p.y,k:3,size:p.r,life:.5,col:'#ffffff'});
  sfx.bloom(Math.min(streak,9)); buzz(18); shake=Math.max(shake,4);
  gloomY+=48;

  if(streak>0&&streak%5===0){ pop(p.x,p.y-p.r-58,'SUPER BLOOM!','#ffd166',24); gloomY+=140; burst(p.x,p.y,40,['#ff7fa6','#ffd166','#6fdc8c','#6ec3ff','#b08bff'],380,2,5); sfx.power() }

}
function land(p){
  const a=Math.atan2(pl.y-p.y,pl.x-p.x), t=-Math.sin(a)*pl.vx+Math.cos(a)*pl.vy;
  pl.st='on'; pl.p=p; pl.ang=a; if(Math.abs(t)>50) pl.dir=t>0?1:-1;
  pl.sqV=-12; p.sqV-=10; pl.assist=0;
  if(!p.awake){ p.awake=true; bonus+=1; pop(p.x+p.r*.7,p.y-p.r-8,'!','#fff',20) }
  if(p.type==='cookie'&&!p.crT) p.crT=.001;

  for(let i=0;i<7;i++){const s=i%2?1:-1;part({x:pl.x,y:pl.y,vx:-Math.sin(a)*s*rand(40,130)+Math.cos(a)*30,vy:Math.cos(a)*s*rand(40,130)+Math.sin(a)*30,life:.35,size:rand(2,4.5),col:'#ffffff'})}

/* ---------- update ---------- */
function update(dt){
  T+=dt;
  const diff=clamp(maxH/9000,0,1);
  // planets
  for(const p of planets){
    p.sqV+=(-p.sq*260-p.sqV*13)*dt; p.sq+=p.sqV*dt;
    if(p.type==='drift'){ p.x=p.baseX+Math.sin(T*p.sp+p.ph)*p.amp }
    p.blinkT-=dt; if(p.blinkT<-.12) p.blinkT=rand(1.5,5);
    if(p.hit>0) p.hit-=dt;
    for(let i=0;i<p.N;i++) if(p.cov[i]&&p.g[i]<1) p.g[i]=Math.min(1,p.g[i]+dt*4);
    if(p.crT>0){ p.crT+=dt;
      if(p.crT>2.5){ p.dead=true; sfx.crumble(); burst(p.x,p.y,18,['#e3b77b','#c9965a','#7a4a2a'],200,0,6); shake=Math.max(shake,5);
        if(pl.st==='on'&&pl.p===p){ pl.st='fly'; pl.vx=0; pl.vy=-60; pl.flyT=1.2; pl.ign=null; if(!p.bloomed&&streak>0){streak=0;$('streak').className=''} } } }
  }
  if(state==='dead'){ deadT+=dt; gloomY-=dt*420; gloomY=Math.max(gloomY,cam.y+H*.25); }
  else {
    pl.sqV+=(-pl.sq*300-pl.sqV*14)*dt; pl.sq+=pl.sqV*dt;
    pl.blinkT-=dt; if(pl.blinkT<-.1) pl.blinkT=rand(1.5,4);
    if(pl.ignT>0) pl.ignT-=dt;
    if(pl.st==='on'){
      const p=pl.p, v=(232+72*diff)*(streak>=5?1.06:1), a0=pl.ang;
      pl.ang+=pl.dir*v/p.r*dt; pl.run+=dt*17;
      if(!p.home){ markCov(p,a0); markCov(p,(a0+pl.ang)/2); markCov(p,pl.ang) }
      place(); pl.rot=pl.ang+PI/2;
      if(p.cov&&!p.home&&Math.random()<dt*14) part({x:pl.x-Math.cos(pl.ang)*8,y:pl.y-Math.sin(pl.ang)*8,vx:rand(-20,20),vy:rand(-20,20),life:.4,size:rand(1.5,3),col:'#b6f5c8'});
    } else if(pl.st==='zoom'){
      pl.zoomT-=dt; pl.vy=-1050; pl.x+=(W/2-pl.x)*dt*2.5; pl.y+=pl.vy*dt; pl.rot=0;
      for(let i=0;i<3;i++) part({x:pl.x+rand(-8,8),y:pl.y+12,vx:rand(-50,50),vy:rand(100,260),life:.6,size:rand(3,6),col:pick(['#ffd166','#ff7fa6','#fff','#6ec3ff']),k:2});
      if(pl.zoomT<=0){ pl.st='fly'; pl.vy=-430; pl.vx=0; pl.flyT=.25; pl.assist=1.6; pl.ign=null }
    } else {
      pl.flyT+=dt;
      pl.vy+=clamp((pl.flyT-.7)/.5,0,1)*1000*dt; pl.vy=Math.min(pl.vy,820);
      for(const p of planets){
        if(p.dead||(p===pl.ign&&pl.ignT>0)) continue;
        const dx=p.x-pl.x, dy=p.y-pl.y, d=Math.hypot(dx,dy)||1, reach=p.r+PR, mag=pl.assist>0?80:46;
        if(d<reach){
          if(p.type==='grump'){
            const nx=-dx/d, ny=-dy/d, dot=pl.vx*nx+pl.vy*ny;
            if(dot<0){pl.vx-=2*dot*nx;pl.vy-=2*dot*ny} pl.vx*=.7;pl.vy*=.7; pl.x=p.x+nx*(reach+1); pl.y=p.y+ny*(reach+1);
            pl.flyT=Math.max(pl.flyT,.9); p.sqV-=12; p.hit=.5; sfx.bonk(); buzz(25); shake=Math.max(shake,7);

  for(const p of pops){ const u=p.t/1.1, s=backOut(Math.min(1,p.t*5)); ctx.globalAlpha=u>.7?(1-u)/.3:1;
    ctx.font=`700 ${p.size*s}px ${FONT}`; const x=clamp(p.x,50,W-50), y=p.y-u*36;
    ctx.strokeStyle=INK; ctx.lineWidth=5; ctx.strokeText(p.txt,x,y); ctx.fillStyle=p.col; ctx.fillText(p.txt,x,y) }
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(S,0,0,S,0,0);
  drawBg();
  const sh=REDUCED?0:shake;
  ctx.save(); ctx.translate(rand(-1,1)*sh,-cam.y+rand(-1,1)*sh);
  drawWorld();
  ctx.restore();
  // danger glow
  const near=clamp(1-(gloomY-pl.y)/230,0,1);
  if(near>0&&state==='play'){ const g=ctx.createLinearGradient(0,H*.55,0,H); g.addColorStop(0,'#b05cff00'); g.addColorStop(1,`rgba(190,90,255,${near*.45*(.75+.25*Math.sin(T*9))})`); ctx.fillStyle=g; ctx.fillRect(0,H*.55,W,H*.45) }
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt=Math.min(.034,(ts-last)/1000||0); last=ts;
  mixMusic();
  if(paused) { render(); return; }
  const steps=dt>.02?2:1; for(let i=0;i<steps;i++) update(dt/steps);
  render();
}

/* ---------- UI wiring ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'){ if(document.activeElement&&document.activeElement.tagName==='BUTTON') return; e.preventDefault(); if(!e.repeat) tap() } if(e.code==='Escape'||e.code==='KeyP') setPause(!paused) });
document.addEventListener('contextmenu',e=>e.preventDefault());
function setPause(v){ if(state!=='play'&&v) return; paused=v; $('paused').hidden=!v; if(!v) last=performance.now() }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ setPause(true); AC&&AC.suspend() } else AC&&AC.resume() });
$('pauseBtn').onclick=()=>{initAudio();sfx.ui();setPause(true)};
$('resumeBtn').onclick=()=>{sfx.ui();setPause(false)};
function muteUI(){
  $('muteIcon').innerHTML=save.muted?'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>';
  $('pMute').textContent='Sound: '+(save.muted?'off':'on');
  if(master) master.gain.value=save.muted?0:1;
}
const toggleMute=()=>{ save.muted=!save.muted; persist(); initAudio(); muteUI(); sfx.ui() };
$('muteBtn').onclick=toggleMute; $('pMute').onclick=toggleMute;
$('againBtn').onclick=()=>{initAudio();sfx.ui();toMenu(true)};
let skinsFrom='title';
function openSkins(from){
  initAudio(); sfx.ui(); skinsFrom=from; $('dewS').textContent=save.dew;
  const grid=$('skinGrid'); grid.innerHTML='';
  SKINS.forEach(sk=>{
    const own=save.owned.includes(sk.id), b=document.createElement('button');
    b.className='skin'+(save.skin===sk.id?' sel':'')+(own?'':' locked'); b.id='skin-'+sk.id;
    const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); x.translate(64,74); x.scale(3.1,3.1); drawChar(x,sk,{run:1,t:0});
    b.appendChild(c);
    const n=document.createElement('span'); n.textContent=sk.name; b.appendChild(n);
    const k=document.createElement('span'); k.className='cost';
    k.innerHTML=own?(save.skin===sk.id?'Hopping':'Owned'):'<i class="drop"></i>'+sk.cost; b.appendChild(k);
    b.onclick=()=>{
      if(save.owned.includes(sk.id)){ save.skin=sk.id; sfx.ui() }
      else if(save.dew>=sk.cost){ save.dew-=sk.cost; save.owned.push(sk.id); save.skin=sk.id; sfx.buy(); $('dew').textContent=$('dewT').textContent=save.dew }
      else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); sfx.bonk(); return }
      persist(); openSkinsRefresh();
    };
    grid.appendChild(b);
  });
  $('over').hidden=true; $('skins').hidden=false;
}
function openSkinsRefresh(){ const f=skinsFrom; openSkins(f) }
$('skinBtn').onclick=()=>openSkins('title');
$('overSkins').onclick=()=>openSkins('over');
$('skinsDone').onclick=()=>{ sfx.ui(); $('skins').hidden=true; if(skinsFrom==='over') $('over').hidden=false };

// logo letters
{ const cols=['#ff7fa6','#ffd166','#7fe0a4','#8fd3ff','#c4a8ff','#ff7fa6','#ffd166','#7fe0a4'];
  [...'Bloomhop'].forEach((ch,i)=>{ const s=document.createElement('span'); s.textContent=ch; s.style.color=cols[i]; s.style.setProperty('--i',i); s.style.setProperty('--r',(i%2?3:-3)+'deg'); s.setAttribute('aria-hidden','true'); $('logo').appendChild(s) }) }

muteUI(); reset(); $('best').textContent=save.best?'Best  '+save.best:'';
window.__bloomhop={get audio(){return {AC,master,lvl,step,secI}},get s(){return {state,score,streak,blooms,aim,pl,maxH,planets,gloomY,cam,paused}},tap,save};
requestAnimationFrame(frame);
})();
</script>
